name: Competitor Research

# Fetches recent posts from tracked Binance Square creators and opens a
# GitHub Issue summarizing what they're posting (topics, cashtags, engagement).
# Read-only — no posting, no commenting. Pure research for strategy.
#
# Tracked creators (edit in scan.mjs → TRACKED_CREATORS array):
#   1. momomomo7171
#   2. Square-Creator-590332761
#   3. CryptoPM
#   4. hmnghia0612

on:
  schedule:
    # 06:00 UTC daily = 08:00 Harare (CAT, UTC+2)
    # Morning — review before your own post goes out at 08:30 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  competitor-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Install binance-square-cli
        run: |
          git clone --depth 1 https://github.com/QuantProcessing/binance-square-cli.git /tmp/bsq
          cd /tmp/bsq
          npm install
          npm run build

      - name: Run competitor scan
        id: scan
        env:
          SCAN_MODE: competitor
        run: |
          OUTPUT=$(node scan.mjs)
          echo "$OUTPUT"
          ISSUE_BODY=$(echo "$OUTPUT" | sed -n '/---ISSUE_BODY_START---/,/---ISSUE_BODY_END---/p' | sed '1d;$d')
          {
            echo "issue_body<<EOF"
            echo "$ISSUE_BODY"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Open GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const label = 'competitor-research';
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: label, color: '5319E7',
                description: 'Daily competitor research digest',
              });
            } catch (e) { core.info('Label exists.'); }
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `📊 Competitor Research — ${today}`,
              labels: [label],
              body: process.env.issue_body,
            });
            core.info(`Filed #${issue.number}.`);
