name: Competitor Research

# Fetches recent posts from tracked Binance Square creators and opens a
# GitHub Issue summarizing what they're posting (topics, cashtags, engagement).
# Read-only — no posting, no commenting. Pure research for strategy.
#
# Tracked creators (edit in scan.mjs → TRACKED_CREATORS array):
#   1. momomomo7171
#   2. Square-Creator-590332761
#   3. CryptoPM
#   4. hmnghia0612

# v11: the schedule is switched OFF. This depends on the unofficial
# binance-square-cli scraper (blocked from GitHub's IPs — it had been filing
# dozens of empty issues). Manual runs still work from the Actions tab, and
# a home PC usually isn't blocked if you want to try one. Close the old
# empty issues if they clutter the tracker.
# Re-add a cron line here if the scraper ever starts working again.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  competitor-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install binance-square-cli (pinned to verified commit)
        run: |
          git clone https://github.com/QuantProcessing/binance-square-cli.git /tmp/bsq
          cd /tmp/bsq
          git checkout 5c4cf33a227ecb07eb934554c969233877f26be7
          npm install
          npm run build

      - name: Run competitor scan
        id: scan
        env:
          SCAN_MODE: competitor
        run: |
          OUTPUT=$(node scan.mjs)
          echo "$OUTPUT"
          ISSUE_BODY=$(echo "$OUTPUT" | sed -n '/---ISSUE_BODY_START---/,/---ISSUE_BODY_END---/p' | sed '1d;$d')
          {
            echo "issue_body<<EOF"
            echo "$ISSUE_BODY"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Open GitHub Issue
        uses: actions/github-script@v8
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const label = 'competitor-research';
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: label, color: '5319E7',
                description: 'Daily competitor research digest',
              });
            } catch (e) { core.info('Label exists.'); }
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `📊 Competitor Research — ${today}`,
              labels: [label],
              body: process.env.issue_body,
            });
            core.info(`Filed #${issue.number}.`);
