name: Daily Binance Square Post

on:
  schedule:
    # 08:30 UTC every day = 10:30 Harare/CAT time (UTC+2).
    # Change the two numbers (minute hour) to shift the posting time.
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print what would be posted, do not post to Binance)'
        required: false
        type: boolean
        default: false
      day_index_override:
        description: 'Diagnostic: override dayIndex (1-31) to test vibe/template rotation. Leave empty for today.'
        required: false
        type: string
        default: ''

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Post to Binance Square
        env:
          # Required: your Binance Square posting API key
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}

          # v4: Multi-provider AI chain. Set any/all of these.
          # The script tries them in order: Groq → OpenRouter → Gemini.
          # If none are set, or all fail, it falls back to template mode.
          #
          # Groq (recommended primary — free, fast, Llama 3.3 70B):
          #   Get a key at console.groq.com (no credit card needed)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          # OpenRouter (fallback — free models available via aggregator):
          #   Get a key at openrouter.ai/keys (no credit card needed for free models)
          #   Default model: meta-llama/llama-3.3-70b-instruct:free
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

          # Gemini (last resort — free, was flaky):
          #   Get a key at aistudio.google.com/apikey
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Optional model overrides (defaults shown):
          # GROQ_MODEL: 'llama-3.3-70b-versatile'
          # OPENROUTER_MODEL: 'meta-llama/llama-3.3-70b-instruct:free'
          # GEMINI_MODEL: 'gemini-2.0-flash'

          # v7: Optional CoinGecko Demo API key. Without this, every
          # CoinGecko call shares the worldwide keyless bucket (5-15
          # req/min, shared with everyone not using a key). Get a free key
          # (no card) at coingecko.com/en/developers/dashboard — moves you
          # to a dedicated 100 req/min bucket instead. getMarketData() is
          # the one call every code path in this script depends on, so this
          # is the single highest-leverage reliability fix available.
          # Script behaves exactly as before if this secret isn't set.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

          # Dry run mode — check the box above to test without posting
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}

          # v5.3: Diagnostic dayIndex override — lets you dry-run different
          # vibes/templates back-to-back to test if rotation produces visibly
          # different output or if the model's prior dominates. Leave empty
          # in production (defaults to today's date).
          DAY_INDEX_OVERRIDE: ${{ github.event.inputs.day_index_override }}
        run: node post.mjs
