name: Daily Binance Square Post

on:
  schedule:
    # 08:30 UTC every day = 10:30 Harare/CAT time (UTC+2).
    # Change the two numbers (minute hour) to shift the posting time.
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print what would be posted, do not post to Binance)'
        required: false
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post to Binance Square
        env:
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          # Optional: only needed if you set up the AI-written-text upgrade.
          # Leave this secret unset and the script quietly uses the fixed
          # templates instead — nothing breaks either way.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Dry run mode — when you tap "Run workflow" and check the dry_run
          # box, the script prints what it WOULD post without calling the
          # Binance API. Useful for testing format changes safely.
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
        run: node post.mjs
