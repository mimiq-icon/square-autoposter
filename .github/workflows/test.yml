name: Tests

# v9.3: The project has had a real, growing unit-test suite (test/post.test.mjs,
# 171 tests as of v10.1) since v7, but nothing ever ran it automatically —
# it only ran if someone remembered `node --test` locally before pushing. This
# closes that gap: every push and pull request that touches the source or the
# tests runs the full suite. Tests are pure/no-network (see the header comment
# in test/post.test.mjs), so this needs no secrets and can't hit rate limits.

on:
  push:
    paths:
      - 'post.mjs'
      - 'scan.mjs'
      - 'news.mjs'
      - 'news-sync.mjs'
      - 'telegram.mjs'
      - 'alerts.mjs'
      - 'article.mjs'
      - 'cards.mjs'
      - 'research.mjs'
      - 'local-runner.mjs'
      - 'test-support/**'
      - 'test/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'post.mjs'
      - 'scan.mjs'
      - 'news.mjs'
      - 'news-sync.mjs'
      - 'telegram.mjs'
      - 'alerts.mjs'
      - 'article.mjs'
      - 'cards.mjs'
      - 'research.mjs'
      - 'local-runner.mjs'
      - 'test-support/**'
      - 'test/**'
      - '.github/workflows/test.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Run test suite (node --test, no npm install needed)
        run: node --test
