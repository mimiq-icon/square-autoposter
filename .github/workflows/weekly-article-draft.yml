name: Weekly Article Draft

# v8: This is half of the fix for the biggest gap in the project — the
# Sunday article used to write itself AND publish itself in the same step,
# so the one piece of content actually worth a human's attention never got
# any. This workflow only writes the draft and opens it as a GitHub Issue
# for review. It makes NO Binance API calls and needs no
# BINANCE_SQUARE_OPENAPI_KEY — see RUN_MODE=weekly-draft in post.mjs.
#
# Publishing happens separately, in weekly-article-publish.yml, and only
# once you add the `approved-for-posting` label to the issue this creates.
#
# v10.2 (restored v11.1): the weekly article is now written by the AI and
# approved on Telegram by weekly-article-telegram.yml. To avoid two articles
# every Sunday THIS workflow's schedule is switched off (manual runs still
# work, and the label-approval flow below is unchanged). To go back to the
# issue-based flow, remove the leading "#" on the three schedule lines and
# disable the Telegram one.

on:
  # schedule:
  #   # 07:30 UTC every Sunday = 09:30 Harare/CAT time.
  #   - cron: '30 7 * * 0'
  workflow_dispatch:
    inputs:
      day_index_override:
        description: 'Diagnostic: override dayIndex (1-31) to test coin rotation. Leave empty for today.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Build the weekly article draft
        env:
          RUN_MODE: weekly-draft
          # Optional — only affects which coins get featured in the chart,
          # not whether this step needs a Binance key (it doesn't).
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          DAY_INDEX_OVERRIDE: ${{ github.event.inputs.day_index_override }}
        run: node post.mjs

      - name: Open or update this week's draft Issue
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const draft = JSON.parse(fs.readFileSync('weekly-draft.json', 'utf8'));
            const label = 'weekly-article-draft';

            // Make sure the labels this flow depends on exist. Fails
            // harmlessly if they already do.
            for (const [name, color, description] of [
              [label, '0e8a16', 'Weekly Binance Square article awaiting human review'],
              ['approved-for-posting', 'd93f0b', 'Add this label to publish the weekly article as currently written'],
            ]) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo, name, color, description,
                });
              } catch (e) {
                core.info(`Label "${name}" already exists — continuing.`);
              }
            }

            const issueTitle = `Weekly Article Draft — ${draft.weekRange}`;

            // Avoid opening a duplicate if this workflow reruns the same week
            // (e.g. a retry) — update the existing open draft instead.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            const match = existing.data.find((i) => i.title === issueTitle);

            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: draft.issueBody,
              });
              core.info(`Updated existing draft issue #${match.number}.`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: draft.issueBody,
                labels: [label],
              });
              core.info(`Opened new draft issue #${issue.number}.`);
            }
