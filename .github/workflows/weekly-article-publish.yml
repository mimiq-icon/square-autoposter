name: Weekly Article Publish

# v6: Triggered when a weekly-article-draft Issue is closed. Reads the
# (edited) Issue body, parses it back into { title, body }, and publishes
# it as an article to Binance Square.
#
# The human's edit workflow:
#   1. weekly-article-draft.yml opens an Issue with the draft
#   2. Human edits the title and body between the HTML comment markers
#   3. Human closes the Issue
#   4. This workflow fires, parses the edited body, publishes to Binance

on:
  issues:
    types: [closed]

permissions:
  issues: write
  contents: read

jobs:
  publish:
    # Only run for issues with the 'weekly-article-draft' label
    if: contains(github.event.issue.labels.*.name, 'weekly-article-draft')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Publish edited article to Binance Square
        env:
          # RUN_MODE=weekly-publish tells post.mjs to read WEEKLY_ARTICLE_BODY,
          # parse it, and publish as an article.
          RUN_MODE: weekly-publish
          # The edited Issue body — this is what the human reviewed/changed.
          WEEKLY_ARTICLE_BODY: ${{ github.event.issue.body }}
          # Binance key required for publishing.
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
        run: node post.mjs

      - name: Comment on the closed Issue with result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = process.env.RUN_CONCLUSION !== 'failure';
            const outcome = success ? '✅ Published successfully' : '❌ Publish failed — check the Actions log';
            const postUrl = success ? '\n\nView the published article in your Binance Square profile.' : '';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `### Weekly Article Publish\n\n${outcome}${postUrl}\n\n---\n_Automated by weekly-article-publish.yml_`,
            });
