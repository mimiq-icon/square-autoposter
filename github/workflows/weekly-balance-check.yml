name: Weekly Write-to-Earn Balance Check

on:
  schedule:
    # Every Thursday at 09:00 UTC = 11:00 Harare time (UTC+2)
    # Binance pays out Write to Earn commissions every Thursday, so this
    # fires the morning of payout day to remind you to check your balance
    # against the 0.1 USDC weekly floor.
    - cron: '0 9 * * 4'
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Weekly balance check reminder
        run: |
          echo "=========================================="
          echo "  WEEKLY WRITE-TO-EARN BALANCE CHECK"
          echo "=========================================="
          echo ""
          echo "Today is Thursday — Binance pays out Write to Earn"
          echo "commissions today. Take 30 seconds to:"
          echo ""
          echo "  1. Open Binance → Square → Creator Center → Write to Earn"
          echo "  2. Note this week's payout in USDC"
          echo "  3. Log it in your spreadsheet with today's date"
          echo ""
          echo "STOP-LOSS RULE:"
          echo "  If balance is below 0.1 USDC for 4 consecutive weeks,"
          echo "  that's not noise — it's the reward structure telling you"
          echo "  automation-only content isn't clearing the bar."
          echo "  At that point: double down on the human-edited Sunday"
          echo "  article, OR shut the automation off and reclaim the time."
          echo ""
          echo "=========================================="
          echo ""
          echo "This reminder runs automatically every Thursday."
          echo "If you want to disable it, edit .github/workflows/weekly-balance-check.yml"
          echo "and either delete the file or comment out the schedule: block."
          echo ""
          echo "=========================================="
