name: Tests

# Runs the test suite on every push and pull request.
# Catches regressions before they reach production.

on:
  push:
    paths:
      - 'post.mjs'
      - 'scan.mjs'
      - 'test/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'post.mjs'
      - 'scan.mjs'
      - 'test/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Run tests
        run: node --test test/post.test.mjs
